        if (minStart === null || seg.start < minStart) minStart = seg.start;
        if (maxEnd === null || seg.end > maxEnd) maxEnd = seg.end;
      });
    });
    let startDate, endDate;
    if (minStart === null) {
      const now = new Date();
      startDate = now; endDate = now;
    } else {
      startDate = state.dates[minStart].dateObj;
      endDate = state.dates[maxEnd].dateObj;
    }
    let startM = startDate.getMonth() - 1, startY = startDate.getFullYear();
    if (startM < 0) { startM = 11; startY--; }
    let endM = endDate.getMonth() + 1, endY = endDate.getFullYear();
    if (endM > 11) { endM = 0; endY++; }
    return { startY, startM, endY, endM };
  }

  function buildDatesForRange(startY, startM, endY, endM) {
    const dates = [];
    let y = startY, m = startM;
    while (y < endY || (y === endY && m <= endM)) {
      const nDays = daysInMonth(y, m);
      for (let d = 1; d <= nDays; d++) dates.push(buildDateInfo(new Date(y, m, d)));
      if (m === 11) { m = 0; y++; } else { m++; }
    }
    return dates;
  }

  // Ridefinisce la larghezza del calendario sulla durata reale dei cantieri (+1 mese per
  // lato). Va richiamata dopo ogni modifica che può cambiare quanto calendario serve
  // davvero: fine di un trascinamento, nuova durata piazzata, cantiere rimosso, importazione.
  function fitCalendarToSites() {
    const r = computeFitRange();
    rebuildCalendar(buildDatesForRange(r.startY, r.startM, r.endY, r.endM));
    renderApp();
    updateMonthlyLabel();
    persistState();
  }

  // ---------- RIDIMENSIONAMENTO COLONNA CANTIERE ----------
  let stickyWidth = 180;
  function applyStickyWidth() {
    document.documentElement.style.setProperty("--sticky-width", stickyWidth + "px");
  }
  function startColResize(evt) {
    evt.preventDefault();
    evt.stopPropagation();
    const getX = e => (e.touches ? e.touches[0].clientX : e.clientX);
    const startX = getX(evt);
    const origWidth = stickyWidth;

    function onMove(e) {
      e.preventDefault();
      stickyWidth = clamp(origWidth + (getX(e) - startX), 120, 420);
      applyStickyWidth();
    }
    function onUp() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      document.removeEventListener("touchmove", onMove);
      document.removeEventListener("touchend", onUp);
      persistState();
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
    document.addEventListener("touchmove", onMove, { passive: false });
    document.addEventListener("touchend", onUp);
  }

  // ---------- SALVATAGGIO PERSISTENTE DELLA PIANIFICAZIONE ----------
  // Usa la memoria persistente di Claude quando disponibile (window.storage); se il file
  // viene aperto direttamente in un browser normale, ripiega su localStorage; se nemmeno
  // quello è disponibile, le modifiche restano solo per la sessione corrente.
  const STORAGE_KEY = "programma-lavori-v2";
  const storageAdapter = {
    async get(key) {
      if (typeof window.storage !== "undefined") {
        try { const r = await window.storage.get(key, false); return r ? r.value : null; }
        catch (e) { return null; }
      }
      try { return localStorage.getItem(key); } catch (e) { return null; }
    },
    async set(key, value) {
      if (typeof window.storage !== "undefined") {
        try { await window.storage.set(key, value, false); return true; }
        catch (e) { return false; }
      }
      try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
    },
    async remove(key) {
      if (typeof window.storage !== "undefined") {
        try { await window.storage.delete(key, false); return true; } catch (e) { return false; }
      }
      try { localStorage.removeItem(key); return true; } catch (e) { return false; }
    },
    // Condivisa: scritta a ogni salvataggio (solo se questo file gira dentro Claude), letta
    // dalla modalità #vista. Essendo lo stesso file/artefatto per entrambe le modalità, a
    // differenza del tentativo precedente con due file separati, qui la condivisione regge.
    async setShared(key, value) {
      if (typeof window.storage === "undefined") return false;
      try { await window.storage.set(key, value, true); return true; } catch (e) { return false; }
    },
    async getShared(key) {
      if (typeof window.storage === "undefined") return null;
      try { const r = await window.storage.get(key, true); return r ? r.value : null; } catch (e) { return null; }
    }
  };

  function flashSaveStatus(ok, message) {
    const el = document.getElementById("saveStatus");
    if (!el) return;
    el.textContent = message || (ok ? "Modifiche salvate" : "Salvataggio non riuscito");
    el.className = "save-status " + (ok ? "save-ok" : "save-err");
    clearTimeout(flashSaveStatus._t);
    flashSaveStatus._t = setTimeout(() => { el.textContent = ""; el.className = "save-status"; }, 2200);
  }

  function planToPayload() {
    return {
      formato: "programma-lavori-cantieri",
      versione: 5,
      esportatoIl: new Date().toISOString(),
      dates: state.dates.map(d => d.dateObj.toISOString()),
      sites: state.sites.map(s => ({
        name: s.name, colorClass: s.colorClass, color: s.color || null, ops: s.ops,
        segments: (s.segments || []).map(seg => ({
          start: seg.start, end: seg.end, workers: seg.workers || 0,
          actual: seg.actual || undefined
        }))
      })),
      totalWorkers,
      dayWidth, stickyWidth, currentMonthKey
    };
  }

  function applyPayload(payload) {
    if (!payload || !Array.isArray(payload.dates) || !Array.isArray(payload.sites)) {
      throw new Error("formato non riconosciuto");
    }
    const dates = payload.dates.map(iso => buildDateInfo(new Date(iso)));
    const sites = payload.sites.map(s => {
      // Formato precedente (versione 3): un numero di operai unico per l'intero cantiere,
      // non per singola fase. Qui viene usato come valore di partenza per ogni fase, cosi
      // l'informazione non va persa aprendo un file esportato prima di questa modifica.
      const legacyWorkers = (typeof s.assignedWorkers === "number") ? s.assignedWorkers : 0;
      let segments;
      if (Array.isArray(s.segments)) {
        segments = s.segments
          .filter(seg => typeof seg.start === "number" && typeof seg.end === "number")
          .map(seg => {
            let actual;
            if (seg.actual && typeof seg.actual === "object") {
              actual = {};
              Object.keys(seg.actual).forEach(k => {
                if (/^\d+$/.test(k) && typeof seg.actual[k] === "number") actual[k] = seg.actual[k];
              });
              if (!Object.keys(actual).length) actual = undefined;
            }
            return {
              start: seg.start, end: seg.end,
              workers: (typeof seg.workers === "number") ? seg.workers : legacyWorkers,
              actual
            };
          });
      } else if (typeof s.ganttStart === "number" && typeof s.ganttEnd === "number") {
        // Formato ancora precedente (versione 1): un'unica durata per cantiere, senza fasi multiple.
        segments = [{ start: s.ganttStart, end: s.ganttEnd, workers: legacyWorkers }];
      } else {
        segments = [];
      }
      return {
        name: s.name || "Cantiere",
        colorClass: s.colorClass || "bg-a",
        color: (typeof s.color === "string" && s.color) ? s.color : null,
        ops: Array.isArray(s.ops) ? s.ops : dates.map(() => 0),
        segments
      };
    });
    state = { dates, sites };
    if (typeof payload.totalWorkers === "number") totalWorkers = payload.totalWorkers;
    if (payload.dayWidth) dayWidth = payload.dayWidth;
    if (payload.stickyWidth) { stickyWidth = payload.stickyWidth; applyStickyWidth(); }
    currentMonthKey = payload.currentMonthKey || (dates.length ? dates[0].monthKey : null);
    renderApp();
    updateMonthlyLabel();
  }

  function formatUpdateTimestamp(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const pad = n => String(n).padStart(2, "0");
    return `Aggiornato il ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} alle ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function setLastUpdateText(iso) {
    const el = document.getElementById("lastUpdateText");
    if (el) el.textContent = formatUpdateTimestamp(iso);
  }

  async function persistState() {
    const payloadObj = planToPayload();
    const payload = JSON.stringify(payloadObj);
    const ok = await storageAdapter.set(STORAGE_KEY, payload);
    storageAdapter.setShared(STORAGE_KEY, payload); // per chi apre il link con #vista
    publishToGithub(payload); // in background: non blocca il salvataggio locale se fallisce
    setLastUpdateText(payloadObj.esportatoIl);
    flashSaveStatus(ok);
  }

  // ---------- PUBBLICAZIONE SU GITHUB (tramite un piccolo "postino" esterno, il Worker) ----------
  const PUBLISH_CONFIG_KEY = "programma-lavori-v5-publish-config";

  async function loadPublishConfig() {
    const raw = await storageAdapter.get(PUBLISH_CONFIG_KEY);
    if (!raw) return;
    try {
      const parsed = JSON.parse(raw);
      publishConfig = { workerUrl: parsed.workerUrl || "", readUrl: parsed.readUrl || "" };
    } catch (e) { /* config non valida, restano i valori vuoti di default */ }
  }

  async function savePublishConfig() {
    await storageAdapter.set(PUBLISH_CONFIG_KEY, JSON.stringify(publishConfig));
  }

  // Manda i dati al Worker, che li scrive su GitHub. Il token vero non passa mai da qui:
  // lo tiene solo il Worker. Se fallisce (Worker non raggiungibile, non configurato...) la
  // pianificazione resta comunque salvata in locale, si riprova al salvataggio successivo.
  async function publishToGithub(payloadJson) {
    const url = publishConfig.workerUrl || DEFAULT_WORKER_URL;
    if (!url) return;
    try {
      await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payloadJson
      });
    } catch (e) { /* nessun avviso: non deve interrompere il salvataggio locale */ }
  }

  function openPublishSettings(evt) {
    evt.stopPropagation();
    closeDateMenu();
    closeWorkforceMenu();
    const menu = document.createElement("div");
    menu.id = "dateMenu";
    menu.className = "date-menu";
    menu.innerHTML = `
      <div class="date-menu-title">Pubblicazione su GitHub</div>
      <label class="date-menu-field">Indirizzo del Worker (per salvare)<input type="text" id="publishWorkerUrl" value="${publishConfig.workerUrl || DEFAULT_WORKER_URL}" placeholder="https://tuo-worker.tuo-account.workers.dev"></label>
      <label class="date-menu-field">Indirizzo raw del file (per leggere, versione sola lettura)<input type="text" id="publishReadUrl" value="${publishConfig.readUrl || DEFAULT_READ_URL}" placeholder="https://raw.githubusercontent.com/utente/repo/main/file.json"></label>
      <div class="date-menu-actions">
        <button type="button" class="date-menu-cancel" onclick="closeDateMenu()">Annulla</button>
        <button type="button" class="date-menu-apply" onclick="applyPublishSettings()">Salva</button>
      </div>`;
    document.body.appendChild(menu);
    const rect = evt.currentTarget.getBoundingClientRect();
    const x = Math.min(rect.left, window.innerWidth - menu.offsetWidth - 12);
    const y = Math.min(rect.bottom + 6, window.innerHeight - menu.offsetHeight - 12);
    menu.style.left = Math.max(8, x) + "px";
    menu.style.top = Math.max(8, y) + "px";
    setTimeout(() => document.addEventListener("mousedown", onDateMenuOutsideClick), 0);
  }

  function applyPublishSettings() {
    const w = document.getElementById("publishWorkerUrl").value.trim();
    const r = document.getElementById("publishReadUrl").value.trim();
    publishConfig = { workerUrl: w, readUrl: r };
    savePublishConfig();
    closeDateMenu();
    persistState(); // pubblica subito, senza aspettare una modifica successiva
  }

  // ---------- ESPORTAZIONE / IMPORTAZIONE (per confrontare alternative o fare backup) ----------
  function exportPlan() {
    const blob = new Blob([JSON.stringify(planToPayload(), null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const stamp = new Date();
    const pad2 = n => String(n).padStart(2, "0");
    const fname = `programma-lavori_${stamp.getFullYear()}${pad2(stamp.getMonth() + 1)}${pad2(stamp.getDate())}-${pad2(stamp.getHours())}${pad2(stamp.getMinutes())}.json`;
    const a = document.createElement("a");
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    flashSaveStatus(true, "File esportato");
  }

  function importPlan(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        pushUndo();
        applyPayload(JSON.parse(e.target.result));
        persistState();
        flashSaveStatus(true, "Pianificazione importata");
      } catch (err) {
        undoStack.pop(); // l'importazione e' fallita, l'istantanea salvata non serve
        updateUndoButton();
        flashSaveStatus(false, "File non valido");
      }
    };
    reader.readAsText(file);
    event.target.value = ""; // permette di reimportare lo stesso file una seconda volta
  }


  async function loadSavedState() {
    const localRaw = await storageAdapter.get(STORAGE_KEY);
    let localPayload = null;
    if (localRaw) {
      try { localPayload = JSON.parse(localRaw); } catch (e) { /* copia locale corrotta, si ignora */ }
    }

    // Confronta con l'ultima pubblicazione su GitHub: se è più recente della copia locale di
    // questo dispositivo (es. una modifica fatta da un altro dispositivo), usa quella. Così
    // un solo salvataggio (automatico a ogni modifica) resta sincronizzato ovunque, senza
    // bisogno di esportare/importare per il lavoro di tutti i giorni.
    let githubPayload = null;
    const readUrl = publishConfig.readUrl || DEFAULT_READ_URL;
    if (readUrl) {
      try {
        const resp = await fetch(readUrl, { cache: "no-store" });
        if (resp.ok) githubPayload = await resp.json();
      } catch (e) { /* GitHub non raggiungibile: si usa solo la copia locale, se c'è */ }
    }

    let chosen = localPayload;
    if (githubPayload) {
      const localTime = localPayload && localPayload.esportatoIl ? Date.parse(localPayload.esportatoIl) : 0;
      const githubTime = githubPayload.esportatoIl ? Date.parse(githubPayload.esportatoIl) : 0;
      if (githubTime > localTime) chosen = githubPayload;
    }

    if (!chosen) return false;
    try {
      applyPayload(chosen);
      if (chosen === githubPayload) await storageAdapter.set(STORAGE_KEY, JSON.stringify(chosen)); // allinea anche la copia locale
      setLastUpdateText(chosen.esportatoIl);
      return true;
    } catch (e) {
      return false;
    }
  }


  function indexOfDate(dates, y, m, d) {
    return dates.findIndex(di => di.dateObj.getFullYear() === y && di.dateObj.getMonth() === m && di.dateObj.getDate() === d);
  }

  function buildDemoData() {
    // Genera solo il mese di partenza, ancorato al mese corrente: sarà fitCalendarToSites(),
    // chiamata subito dopo, a ridefinire la larghezza reale (durata dei cantieri + 1 mese
    // per lato), quindi qui basta un punto di partenza qualsiasi.
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const demoDates = [];
    const nDays = daysInMonth(y, m);
    for (let d = 1; d <= nDays; d++) demoDates.push(buildDateInfo(new Date(y, m, d)));
    const place = pattern => {
      const ops = new Array(demoDates.length).fill(0);
      pattern.forEach((v, i) => { if (i < ops.length) ops[i] = v; });
      return ops;
    };
    const demoSites = [
      { name: "Cantiere A (Edilizia)", colorClass: "bg-a", ops: place([2, 2, 4, 4, 8, 8, 4]), assignedWorkers: 6 },
      { name: "Cantiere B (Infrastrutture)", colorClass: "bg-b", ops: place([5, 5, 6, 6, 2, 2, 4]), assignedWorkers: 5 },
      { name: "Cantiere C (Restauro)", colorClass: "bg-c", ops: place([5, 5, 2, 2, 2, 2, 4]), assignedWorkers: 4 },
      { name: "Ferie / Assenze", colorClass: "bg-off", ops: new Array(demoDates.length).fill(0), assignedWorkers: 0 }
    ];
    return { demoDates, demoSites };
  }

  function loadDemo() {
    const { demoDates, demoSites } = buildDemoData();
    initFromRaw(demoDates, demoSites);
  }

  // ---------- MODALITÀ SOLA LETTURA: stesso link, con #vista in fondo ----------
  const READONLY = /vista|lettura|readonly/i.test(location.hash);

  function renderReadonlyEmptyState() {
    document.getElementById("ganttTable").innerHTML =
      `<tbody><tr><td style="padding:32px 16px;text-align:center;color:#64748B;">Nessuna pianificazione disponibile ancora.<br>Chi la modifica deve aprire il link normale (senza #vista) e salvare almeno una modifica.</td></tr></tbody>`;
  }

  async function loadSharedIntoView() {
    const readUrl = publishConfig.readUrl || DEFAULT_READ_URL;
    if (readUrl) {
      try {
        const resp = await fetch(readUrl, { cache: "no-store" });
        if (resp.ok) {
          const data = await resp.json();
          applyPayload(data);
          setLastUpdateText(data.esportatoIl);
          return;
        }
      } catch (e) { /* GitHub non raggiungibile: si prova la via di riserva sotto */ }
    }
    const raw = await storageAdapter.getShared(STORAGE_KEY);
    if (!raw) { renderReadonlyEmptyState(); return; }
    try {
      const data = JSON.parse(raw);
      applyPayload(data);
      setLastUpdateText(data.esportatoIl);
    } catch (e) { /* si riprova al prossimo aggiornamento automatico */ }
  }

  async function bootReadonly() {
    document.body.classList.add("readonly");
    applyStickyWidth();
    await loadPublishConfig();
    await loadSharedIntoView();
    setInterval(loadSharedIntoView, 20000); // si aggiorna da sola, niente da premere
    document.getElementById("ganttScrollWrap").addEventListener("scroll", () => {
      updateMonthlyLabel(); scheduleBarLabelUpdate();
    });
    setTimeout(scrollToToday, 50);
  }

  async function boot() {
    if (READONLY) { await bootReadonly(); return; }

    applyStickyWidth();
    await loadPublishConfig();
    const restored = await loadSavedState();
    if (!restored) loadDemo();

    state.sites.forEach(mergeAdjacentSegments);

    // Ridefinisce sempre la larghezza del calendario sulla durata reale dei cantieri
    // (+1 mese per lato), sia per i dati demo sia per una pianificazione già salvata.
    fitCalendarToSites();

    document.getElementById("ganttScrollWrap").addEventListener("scroll", () => {
      updateMonthlyLabel(); scheduleBarLabelUpdate();
    });

    setTimeout(scrollToToday, 50);
  }

  boot();
</script>
